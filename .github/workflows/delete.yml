name: 2 - Delete All Translations

on:
  workflow_dispatch:
    description: 'Remove all translation files from the translation/ folder'
    inputs:
      confirm:
        description: 'Type "yes" to confirm deletion of all translation files'
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes" ]; then
            echo "Deletion cancelled. You must type 'yes' to confirm."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove translation folder
        run: |
          if [ -d "translation" ]; then
            rm -rf translation
            echo "Removed translation/ folder and all its contents."
          else
            echo "No translation/ folder found – nothing to delete."
          fi

      - name: Commit and push deletion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Delete all translation files [skip ci]"
          git push
