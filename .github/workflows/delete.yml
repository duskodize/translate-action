name: ۲ - حذف همه ترجمه‌ها

on:
  workflow_dispatch:
    description: 'حذف تمام فایل‌های ترجمه از پوشه translation/'
    inputs:
      confirm:
        description:  '"yes" :برای تایید تایپ کنید'
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete-translations:
    runs-on: ubuntu-latest
    steps:
      - name: تأیید عملیات
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes" ]; then
            echo "عملیات حذف لغو شد. برای تأیید باید 'yes' تایپ کنید."
            exit 1
          fi

      - name: دریافت مخزن
        uses: actions/checkout@v4

      - name: حذف پوشه translation
        run: |
          if [ -d "translation" ]; then
            rm -rf translation
            echo "پوشه translation/ و تمام محتویات آن حذف شد."
          else
            echo "پوشه translation/ یافت نشد – چیزی برای حذف وجود ندارد."
          fi

      - name: commit و push حذف
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "حذف تمام فایل‌های ترجمه [skip ci]"
          git push
