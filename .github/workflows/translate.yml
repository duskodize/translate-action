name: 1 - Translate with Google Translate

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'Text to translate'
        required: true
        type: string
      target_lang:
        description: 'Target language code (e.g., es, fr, de, zh, ja)'
        required: true
        default: 'en'
        type: string

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install deep-translator
        run: pip install deep-translator

      - name: Translate text (preserving newlines)
        id: translate
        env:
          TEXT: ${{ github.event.inputs.text }}
          TARGET: ${{ github.event.inputs.target_lang }}
        run: |
          # Pass the multi-line text via a here-doc to avoid variable expansion issues
          python -c "
          import os
          from deep_translator import GoogleTranslator

          # Read the multi-line text from the environment variable
          text = os.environ['TEXT']
          target = os.environ['TARGET']

          translator = GoogleTranslator(source='auto', target=target)
          translated = translator.translate(text)

          # For logs
          print('--- Original text ---')
          print(text)
          print('--- Translated text ---')
          print(translated)

          # Save to GitHub output (will be single-line, but that’s fine for internal use)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              # Escape newlines for safe single-line output
              escaped = translated.replace('\n', '\\n')
              f.write(f'result={escaped}')
          "

      - name: Save translation to file (preserving format)
        env:
          TEXT: ${{ github.event.inputs.text }}
          TARGET: ${{ github.event.inputs.target_lang }}
          TRANSLATED: ${{ steps.translate.outputs.result }}
        run: |
          mkdir -p translation
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          FILENAME="translation_${TIMESTAMP}_to_${TARGET}.txt"
          FILEPATH="translation/${FILENAME}"

          # Write original and translated text, preserving all line breaks
          {
            echo "=== Original text ==="
            echo "$TEXT"
            echo ""
            echo "=== Translation (target: $TARGET) ==="
            # Convert escaped newlines back to real newlines
            echo -e "$TRANSLATED"
          } > "$FILEPATH"

          echo "Created $FILEPATH"

      - name: Commit and push translation file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translation/
          git diff --quiet && git diff --staged --quiet || git commit -m "Add translation file [skip ci]"
          git push
