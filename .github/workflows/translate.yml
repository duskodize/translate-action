name: ۱ - ترجمه با گوگل ترنسلیت 

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'متنی که می‌خواهید ترجمه شود'
        required: true
        type: string
      target_lang:
        description: 'کد زبان مقصد (مثال: fa برای فارسی، en برای انگلیسی، es برای اسپانیایی)'
        required: true
        default: 'fa'
        type: string

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4

      - name: نصب deep-translator
        run: pip install deep-translator

      - name: ترجمه متن (حفظ خطوط جدید)
        id: translate
        env:
          TEXT: ${{ github.event.inputs.text }}
          TARGET: ${{ github.event.inputs.target_lang }}
        run: |
          python -c "
          import os
          from deep_translator import GoogleTranslator

          text = os.environ['TEXT']
          target = os.environ['TARGET']

          translator = GoogleTranslator(source='auto', target=target)
          translated = translator.translate(text)

          print('--- متن اصلی ---')
          print(text)
          print('--- متن ترجمه شده ---')
          print(translated)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              escaped = translated.replace('\n', '\\n')
              f.write(f'result={escaped}')
          "

      - name: ذخیره ترجمه در فایل (حفظ قالب)
        env:
          TEXT: ${{ github.event.inputs.text }}
          TARGET: ${{ github.event.inputs.target_lang }}
          TRANSLATED: ${{ steps.translate.outputs.result }}
        run: |
          mkdir -p translation
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          FILENAME="translation_${TIMESTAMP}_to_${TARGET}.txt"
          FILEPATH="translation/${FILENAME}"

          {
            echo "=== متن اصلی ==="
            echo "$TEXT"
            echo ""
            echo "=== ترجمه (زبان مقصد: $TARGET) ==="
            echo -e "$TRANSLATED"
          } > "$FILEPATH"

          echo "ایجاد شد: $FILEPATH"

      - name: commit و push فایل ترجمه
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translation/
          git diff --quiet && git diff --staged --quiet || git commit -m "افزودن فایل ترجمه [skip ci]"
          git push
      - name: Commit and push translation file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translation/
          git diff --quiet && git diff --staged --quiet || git commit -m "Add translation file [skip ci]"
          git push
